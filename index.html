    <!-- App Logic & Questions Dataset -->
    <script>
        // QUESTION BANK (44 QUESTIONS TOTAL)
        const questions = [
            // ================= PART I: 20 MCQs =================
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Hiện tượng con cái sinh ra có những đặc điểm khác với bố mẹ và khác nhau ở nhiều chi tiết được gọi là gì?",
                options: ["Di truyền.", "Biến dị.", "Tính trạng.", "Kiểu hình."],
                ans: 1,
                exp: "<b>Giải thích:</b> Biến dị là hiện tượng con cái sinh ra có đặc điểm khác nhau và khác bố mẹ. Di truyền là sự truyền đạt tính trạng từ thế hệ này sang thế hệ khác."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Theo Mendel, nhân tố di truyền (ngày nay gọi là gen) nằm trong tế bào quy định yếu tố nào của cơ thể?",
                options: ["Sự phát triển thể chất.", "Sự di truyền của tính trạng.", "Tốc độ trao đổi chất.", "Số lượng tế bào."],
                ans: 1,
                exp: "<b>Giải thích:</b> Các nhân tố di truyền quy định các tính trạng của cơ thể sinh vật và được truyền đạt qua các thế hệ."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Phương pháp nghiên cứu độc đáo giúp Mendel phát hiện ra các quy luật di truyền là gì?",
                options: ["Quan sát dưới kính hiển vi.", "Phân tích các thế hệ lai.", "Gây đột biến nhân tạo.", "Thực hiện thụ tinh trong ống nghiệm."],
                ans: 1,
                exp: "<b>Giải thích:</b> Phương pháp phân tích các thế hệ lai là phương pháp độc đáo, quyết định đến sự thành công của Mendel."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Kí hiệu kiểu gen nào sau đây biểu diễn thể đồng hợp trội?",
                options: ["Aa", "aa", "AA", "aA"],
                ans: 2,
                exp: "<b>Giải thích:</b> Thể đồng hợp trội chứa 2 allele trội giống nhau (AA)."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Cơ thể có kiểu gen Aa khi giảm phân bình thường sẽ tạo ra các loại giao tử với tỉ lệ nào?",
                options: ["100% A", "100% a", "50% A : 50% a", "75% A : 25% a"],
                ans: 2,
                exp: "<b>Giải thích:</b> Do sự phân li độc lập của các allele trong giảm phân, cơ thể dị hợp Aa tạo 2 loại giao tử ngang nhau: 1A : 1a."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Phép lai nào sau đây được dùng để kiểm tra kiểu gen của cá thể mang tính trạng trội?",
                options: ["Lai phân tích.", "Lai thuận nghịch.", "Lai khác loài.", "Tự thụ phấn."],
                ans: 0,
                exp: "<b>Giải thích:</b> Lai phân tích là phép lai giữa cá thể mang tính trạng trội cần xác định kiểu gen với cá thể mang tính trạng lặn."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Đơn vị cấu tạo nên phân tử DNA là:",
                options: ["Amino acid.", "Nucleotide.", "Glucose.", "Fatty acid."],
                ans: 1,
                exp: "Giải thích: DNA là đại phân tử sinh học cấu tạo theo nguyên tắc đa phân mà đơn phân là nucleotide."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Loại nucleotide nào sau đây KHÔNG có trong cấu trúc của phân tử DNA?",
                options: ["Adenine (A)", "Thymine (T)", "Uracil (U)", "Guanine (G)"],
                ans: 2,
                exp: "<b>Giải thích:</b> DNA gồm 4 loại nucleotide: A, T, G, C. Uracil (U) chỉ xuất hiện trong phân tử RNA."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Theo nguyên tắc bổ sung (NTBS) giữa hai mạch đơn DNA, các nucleotide liên kết với nhau thành cặp như thế nào?",
                options: ["A-G; T-C", "A-T; G-C", "A-C; G-T", "A-A; T-T"],
                ans: 1,
                exp: "<b>Giải thích:</b> Adenine (A) liên kết bổ sung với Thymine (T) bằng 2 liên kết H; Guanine (G) liên kết với Cytosine (C) bằng 3 liên kết H."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Mỗi chu kì xoắn của phân tử DNA có chiều dài 34 Å. Số cặp nucleotide trong 1 chu kì xoắn là:",
                options: ["5 cặp.", "10 cặp.", "12 cặp.", "20 cặp."],
                ans: 1,
                exp: "<b>Giải thích:</b> Một chu kì xoắn DNA gồm 10 cặp nucleotide (20 nucleotide) và có chiều dài 34 Å."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Ở lúa, A: thân cao >> a: thân thấp. Cho cây thân cao thuần chủng (AA) lai với cây thân thấp (aa), F1 thu được kiểu hình là:",
                options: ["100% thân thấp.", "50% cao : 50% thấp.", "100% thân cao.", "75% cao : 25% thấp."],
                ans: 2,
                exp: "<b>Giải thích:</b> P: AA x aa → F1: 100% Aa (100% Thân cao)."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Cho các cây F1 có kiểu gen Aa tự thụ phấn, tỉ lệ kiểu gen thu được ở đời F2 là:",
                options: ["1 AA : 2 Aa : 1 aa", "3 AA : 1 aa", "1 AA : 1 aa", "1 Aa : 1 aa"],
                ans: 0,
                exp: "<b>Giải thích:</b> Phép lai Aa x Aa cho kết quả F2: 1/4 AA : 2/4 Aa : 1/4 aa."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Dòng thuần chủng được định nghĩa là gì?",
                options: ["Dòng có đặc tính di truyền đồng nhất và ổn định qua các thế hệ.", "Dòng luôn luôn cho kiểu hình lặn.", "Dòng gồm toàn các cá thể dị hợp.", "Dòng được tạo ra bằng phép lai phân tích."],
                ans: 0,
                exp: "<b>Giải thích:</b> Dòng thuần chủng có đặc tính di truyền đồng nhất, thế hệ sau sinh ra giống hệt thế hệ trước."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Trong phân tử DNA, nếu số nucleotide loại A = 600 thì số nucleotide loại T là:",
                options: ["300", "600", "1200", "2400"],
                ans: 1,
                exp: "<b>Giải thích:</b> Theo NTBS: A = T, do đó T = 600."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Một đoạn mạch DNA có trình tự: – A – T – G – C – A –. Trình tự mạch bổ sung với nó là:",
                options: ["– T – A – C – G – T –", "– A – T – G – C – A –", "– U – A – C – G – U –", "– C – G – T – A – C –"],
                ans: 0,
                exp: "<b>Giải thích:</b> Áp dụng NTBS (A-T, T-A, G-C, C-G) ta được chuỗi bổ sung là: – T – A – C – G – T –."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Chức năng sinh học quan trọng nhất của phân tử DNA là gì?",
                options: ["Cung cấp năng lượng cho các hoạt động sống.", "Lưu giữ, bảo quản và truyền đạt thông tin di truyền.", "Xúc tác các phản ứng hóa sinh trong tế bào.", "Vận chuyển chất dinh dưỡng qua màng."],
                ans: 1,
                exp: "<b>Giải thích:</b> DNA mang thông tin mã hóa các đặc điểm di truyền của loài và truyền cho thế hệ sau."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Khi thực hiện lai phân tích một cá thể mang tính trạng trội thu được F1 có 100% tính trạng trội. Kiểu gen cá thể đó là:",
                options: ["Đồng hợp trội (AA)", "Dị hợp (Aa)", "Đồng hợp lặn (aa)", "Không xác định được"],
                ans: 0,
                exp: "<b>Giải thích:</b> Kết quả lai phân tích đồng tính (100% trội) chứng tỏ cá thể mang tính trạng trội có kiểu gen đồng hợp AA."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Tập hợp tất cả các tính trạng của cơ thể sinh vật được gọi là gì?",
                options: ["Kiểu gen.", "Kiểu hình.", "Mô hình di truyền.", "Nhân tố di truyền."],
                ans: 1,
                exp: "<b>Giải thích:</b> Kiểu hình là tổ hợp toàn bộ các tính trạng quan sát được của cơ thể sinh vật."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Tính đa dạng và đặc thù của phân tử DNA được quy định bởi yếu tố nào?",
                options: ["Số lượng, thành phần và trình tự sắp xếp các nucleotide.", "Khối lượng và chiều dài của DNA.", "Số lượng các liên kết hydrogen.", "Vị trí của phân tử DNA trong nhân tế bào."],
                ans: 0,
                exp: "<b>Giải thích:</b> Trình tự, số lượng và thành phần nucleotide quyết định tính đặc thù và đa dạng vô tận của DNA."
            },
            {
                type: "mcq",
                part: "Phần I: Trắc Nghiệm (4 lựa chọn)",
                q: "Ở đậu Hà Lan, A: hạt vàng >> a: hạt xanh. Cây hạt vàng dị hợp (Aa) tự thụ phấn thu được F1 có tỉ lệ kiểu hình là:",
                options: ["100% hạt vàng.", "3 hạt vàng : 1 hạt xanh.", "1 hạt vàng : 1 hạt xanh.", "1 hạt vàng : 3 hạt xanh."],
                ans: 1,
                exp: "<b>Giải thích:</b> Aa x Aa → 3/4 A- (Vàng) : 1/4 aa (Xanh) = 3 Vàng : 1 Xanh."
            },

            // ================= PART II: 10 TRUE/FALSE =================
            {
                type: "tf",
                part: "Phần II: Trắc Nghiệm Đúng / Sai",
                q: "Nhóm học sinh thực hiện mô hình DNA 3D. Mạch thứ nhất của đoạn DNA có trình tự: – A – T – G – C – C – G – A – T – A – G –.",
                items: [
                    "Mô hình DNA hoàn chỉnh gồm 2 mạch đơn song song, xoắn đều quanh một trục.",
                    "Theo nguyên tắc bổ sung, khi lắp mạch 2, A liên kết với G và T liên kết với C.",
                    "Mạch 2 bổ sung có trình tự là: – T – A – C – G – G – C – T – A – T – C –.",
                    "Hai phân tử DNA có số lượng nucleotide bằng nhau thì luôn có cấu trúc hoàn toàn giống nhau."
                ],
                ans: [true, false, true, false],
                exp: "<b>Giải thích:</b><br>a) Đúng - Mô tả đúng cấu trúc mô hình DNA.<br>b) Sai - A liên kết với T, G liên kết với C.<br>c) Đúng - Đúng theo nguyên tắc bổ sung.<br>d) Sai - Cấu trúc còn phụ thuộc vào trình tự sắp xếp các nucleotide."
            },
            {
                type: "tf",
                part: "Phần II: Trắc Nghiệm Đúng / Sai",
                q: "Xét thí nghiệm lai một cặp tính trạng của Mendel về màu hoa đậu Hà Lan (Hoa đỏ x Hoa trắng):",
                items: [
                    "Mỗi tính trạng của cơ thể do một cặp nhân tố di truyền quy định.",
                    "Các nhân tố di truyền hòa trộn vào nhau khi cơ thể tạo giao tử.",
                    "F2 có sự phân li kiểu hình theo tỉ lệ 3 Trội : 1 Lặn.",
                    "Tỉ lệ kiểu gen ở F2 thu được là 1 AA : 2 Aa : 1 aa."
                ],
                ans: [true, false, true, true],
                exp: "<b>Giải thích:</b><br>b) Sai - Các nhân tố di truyền phân li độc lập và giữ nguyên bản chất, không hòa trộn."
            },
            {
                type: "tf",
                part: "Phần II: Trắc Nghiệm Đúng / Sai",
                q: "Khi nói về cấu trúc và đặc điểm của phân tử DNA:",
                items: [
                    "Đơn phân cấu tạo nên DNA là các amino acid.",
                    "Mỗi chu kì xoắn của DNA bao gồm 10 cặp nucleotide.",
                    "Các nucleotide trên 2 mạch đơn liên kết với nhau bằng các liên kết hydrogen.",
                    "Đường kính của chuỗi xoắn kép DNA là 20 Å."
                ],
                ans: [false, true, true, true],
                exp: "<b>Giải thích:</b><br>a) Sai - Đơn phân của DNA là các nucleotide."
            },
            {
                type: "tf",
                part: "Phần II: Trắc Nghiệm Đúng / Sai",
                q: "Về quy trình và ý nghĩa của phép lai phân tích:",
                items: [
                    "Là phép lai giữa cá thể mang tính trạng trội với cá thể mang tính trạng lặn.",
                    "Mục đích chính là để xác định kiểu gen của cá thể mang tính trạng lặn.",
                    "Nếu F1 phân li tỉ lệ 1 : 1 thì cá thể mang tính trạng trội có kiểu gen dị hợp (Aa).",
                    "Nếu F1 đồng tính 100% thì cá thể mang tính trạng trội có kiểu gen đồng hợp (AA)."
                ],
                ans: [true, false, true, true],
                exp: "<b>Giải thích:</b><br>b) Sai - Mục đích chính là để xác định kiểu gen của cá thể mang tính trạng TRỘI."
            },
            {
                type: "tf",
                part: "Phần II: Trắc Nghiệm Đúng / Sai",

        // STATE VARS
        let currentIndex = 0;
        let userState = {}; // Stores user choices/inputs

        // INITIALIZATION
        window.onload = () => {
            initJumpSelect();
            renderQuestion();
        };

        function initJumpSelect() {
            const select = document.getElementById("jump-select");
            select.innerHTML = "";
            questions.forEach((q, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `Câu ${idx + 1} (${q.type.toUpperCase()})`;
                select.appendChild(opt);
            });
        }

        function updateProgress() {
            const pct = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${pct}%`;
            document.getElementById("question-index-text").innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
            document.getElementById("jump-select").value = currentIndex;

            // Nav buttons state
            document.getElementById("prev-btn").disabled = (currentIndex === 0);
            document.getElementById("next-btn").disabled = (currentIndex === questions.length - 1);
        }

        function navigate(dir) {
            const nextIdx = currentIndex + dir;
            if (nextIdx >= 0 && nextIdx < questions.length) {
                currentIndex = nextIdx;
                renderQuestion();
            }
        }

        function jumpToQuestion(idx) {
            currentIndex = parseInt(idx);
            renderQuestion();
        }

        // MAIN RENDERER
        function renderQuestion() {
            updateProgress();
            const q = questions[currentIndex];
            const container = document.getElementById("question-container");
            document.getElementById("part-badge").innerText = q.part;

            if (q.type === "mcq") {
                renderMCQ(q, container);
            } else if (q.type === "tf") {
                renderTF(q, container);
            } else if (q.type === "sa") {
                renderSA(q, container);
            } else if (q.type === "essay") {
                renderEssay(q, container);
            }
        }

        // 1. RENDER MCQ
        function renderMCQ(q, container) {
            const saved = userState[currentIndex];
            const isAnswered = saved !== undefined;

            let html = `
                <div class="space-y-4">
                    <h2 class="text-base sm:text-lg font-semibold text-slate-800 leading-snug">${q.q}</h2>
                    <div class="grid grid-cols-1 gap-3">
            `;

            q.options.forEach((opt, idx) => {
                let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100 hover:border-slate-300";
                
                if (isAnswered) {
                    if (idx === q.ans) {
                        btnStyle = "opt-correct font-semibold";
                    } else if (saved === idx) {
                        btnStyle = "opt-wrong";
                    } else {
                        btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                    }
                }

                html += `
                    <button onclick="answerMCQ(${idx})" ${isAnswered ? 'disabled' : ''} 
                            class="opt-btn w-full text-left p-3.5 rounded-xl border-2 flex items-center space-x-3 text-sm sm:text-base ${btnStyle}">
                        <span class="w-7 h-7 rounded-lg bg-white/80 border border-slate-300 flex items-center justify-center font-bold text-xs shrink-0">
                            ${String.fromCharCode(65 + idx)}
                        </span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            html += `</div></div>`;

            // Explanation Box
            if (isAnswered) {
                html += `
                    <div class="mt-4 p-4 rounded-xl bg-emerald-50 border-l-4 border-emerald-500 text-slate-700 text-sm space-y-1 animate-fadeIn">
                        <div class="font-bold text-emerald-800 flex items-center space-x-2">
                            <i class="fa-solid fa-lightbulb text-amber-500"></i>
                            <span>Giải Thích Kiến Thức:</span>
                        </div>
                        <div>${q.exp}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function answerMCQ(idx) {
            userState[currentIndex] = idx;
            renderQuestion();
        }

                    <h2 class="text-base sm:text-lg font-semibold text-slate-800 leading-snug">${q.q}</h2>
                    
                    <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                                <tr>
                                    <th class="p-3">Ý nhận định</th>
                                    <th class="p-3 text-center w-28">Lựa chọn</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
            `;

            q.items.forEach((item, idx) => {
                const userChoice = saved[idx];
                const correct = q.ans[idx];

                let trueBtnClass = "bg-slate-100 text-slate-600 hover:bg-emerald-100 hover:text-emerald-700";
                let falseBtnClass = "bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700";

                if (userChoice !== null) {
                    if (userChoice === true) {
                        trueBtnClass = (correct === true) ? "bg-emerald-600 text-white font-bold" : "bg-rose-500 text-white font-bold";
                    }
                    if (userChoice === false) {
                        falseBtnClass = (correct === false) ? "bg-emerald-600 text-white font-bold" : "bg-rose-500 text-white font-bold";
                    }
                }

                html += `
                    <tr>
                        <td class="p-3 text-slate-700 font-medium"><b>${String.fromCharCode(97 + idx)})</b> ${item}</td>
                        <td class="p-3 text-center shrink-0">
                            <div class="inline-flex rounded-lg p-0.5 bg-slate-100 border border-slate-200 space-x-1">
                                <button onclick="answerTF(${idx}, true)" ${isSubmitted ? 'disabled' : ''} 
                                        class="px-2.5 py-1 text-xs rounded-md transition-all ${trueBtnClass}">Đ</button>
                                <button onclick="answerTF(${idx}, false)" ${isSubmitted ? 'disabled' : ''} 
                                        class="px-2.5 py-1 text-xs rounded-md transition-all ${falseBtnClass}">S</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;

            if (!isSubmitted) {
                html += `
                    <button onclick="submitTF()" class="mt-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all">
                        Kiểm Tra Kết Quả
                    </button>
                `;
            } else {
                html += `
                    <div class="mt-4 p-4 rounded-xl bg-emerald-50 border-l-4 border-emerald-500 text-slate-700 text-sm space-y-1">
                        <div class="font-bold text-emerald-800 flex items-center space-x-2">
                            <i class="fa-solid fa-lightbulb text-amber-500"></i>
                            <span>Giải Thích Chi Tiết:</span>
                        </div>
                        <div>${q.exp}</div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function answerTF(itemIdx, val) {
            if (!userState[currentIndex]) userState[currentIndex] = [null, null, null, null];
            userState[currentIndex][itemIdx] = val;
            renderQuestion();
        }

        function submitTF() {
            const current = userState[currentIndex];
            if (!current || current.includes(null)) {
                alert("Vui lòng chọn Đúng (Đ) hoặc Sai (S) cho tất cả 4 ý!");
                return;
            }
            renderQuestion();
        }

        // 3. RENDER SHORT ANSWER
        function renderSA(q, container) {
            const saved = userState[currentIndex];
            const isSubmitted = saved !== undefined;
            const isCorrect = isSubmitted && (saved.trim().toLowerCase() === q.ans.trim().toLowerCase());

            let html = `
                <div class="space-y-4">
                    <h2 class="text-base sm:text-lg font-semibold text-slate-800 leading-snug">${q.q}</h2>
                    
                    <div class="flex gap-2">
                        <input type="text" id="sa-input" value="${saved || ''}" ${isSubmitted ? 'disabled' : ''}
                               placeholder="Nhập kết quả (chỉ nhập số/từ ngắn)..." 
                               class="flex-1 border-2 border-slate-300 rounded-xl px-4 py-2.5 outline-none focus:border-emerald-500 text-slate-800 font-medium">
                        ${!isSubmitted ? `
                            <button onclick="submitSA()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl transition-all">
                                Nộp Bài
                            </button>
                        ` : ''}
                    </div>
            `;

            if (isSubmitted) {
                html += `
                    <div class="p-3 rounded-xl ${isCorrect ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'} font-semibold text-sm flex items-center space-x-2">
                        <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'} text-lg"></i>
                        <span>${isCorrect ? 'Chính xác!' : `Chưa đúng. Đáp án chuẩn là: ${q.ans}`}</span>
                    </div>

                    <div class="p-4 rounded-xl bg-emerald-50 border-l-4 border-emerald-500 text-slate-700 text-sm space-y-1">
                        <div class="font-bold text-emerald-800 flex items-center space-x-2">
                            <i class="fa-solid fa-lightbulb text-amber-500"></i>
                            <span>Hướng Dẫn Chi Tiết:</span>
                        </div>
                        <div>${q.exp}</div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function submitSA() {
            const val = document.getElementById("sa-input").value;
            if (!val.trim()) {
                alert("Vui lòng nhập câu trả lời trước khi gửi!");
                return;
            }
            userState[currentIndex] = val;
            renderQuestion();
        }

        // 4. RENDER ESSAY
        function renderEssay(q, container) {
            if (!userState[currentIndex]) userState[currentIndex] = { input: "", showExp: false };
            const state = userState[currentIndex];

            let html = `
                <div class="space-y-4">
                    <h2 class="text-base sm:text-lg font-semibold text-slate-800 leading-snug whitespace-pre-line">${q.q}</h2>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Ghi chép/Tóm tắt lời giải của bạn (tùy chọn):</label>
                        <textarea id="essay-input" rows="3" oninput="saveEssayInput(this.value)"
                                  placeholder="Nhập nháp bài làm của bạn vào đây..." 
                                  class="w-full border-2 border-slate-200 rounded-xl p-3 outline-none focus:border-emerald-500 text-sm text-slate-700">${state.input}</textarea>
                    </div>

                    <button onclick="toggleEssayExp()" class="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition-all shadow-sm">
                        <i class="fa-solid ${state.showExp ? 'fa-eye-slash' : 'fa-eye'}"></i>
                        <span>${state.showExp ? 'Ẩn Hướng Dẫn Giải' : 'Xem Đáp Án & Lời Giải Chi Tiết'}</span>
                    </button>
            `;

            if (state.showExp) {
                html += `
                    <div class="p-4 rounded-xl bg-emerald-50 border-l-4 border-emerald-500 text-slate-800 text-sm animate-fadeIn">
                        <div class="font-bold text-emerald-900 mb-2 flex items-center space-x-2 border-b border-emerald-200 pb-2">
                            <i class="fa-solid fa-graduation-cap text-emerald-600 text-base"></i>
                            <span>Lời Giải Chi Tiết SGK:</span>
                        </div>
                        ${q.exp}
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function saveEssayInput(val) {
            if (!userState[currentIndex]) userState[currentIndex] = { input: "", showExp: false };
            userState[currentIndex].input = val;
        }

        function toggleEssayExp() {
            if (!userState[currentIndex]) userState[currentIndex] = { input: "", showExp: false };
            userState[currentIndex].showExp = !userState[currentIndex].showExp;
            renderQuestion();
        }
    </script>
</body>
</html>
